name: Scheduled sweeps

# Three operator jobs that keep the protocol moving without anyone watching:
#
#   v1-auction-refresh  settles won auctions, re-opens unsold ones for another
#                       24 hours, and stops at the round ceiling.
#   v1-demand-refresh   ingests BidPlaced events into the demand counts behind
#                       the pricing engine's market multipliers.
#   v1-notify-sweep     tells people about state that is waiting on them — an
#                       offer on their token, a swap holding their NFT, a bid
#                       they have just lost.
#
# Order matters only in that notifications run last: a person told about an
# auction should be told after that auction has been settled or re-opened, not
# before.
#
# Both authorise by a secret header rather than a Supabase session, and both are
# exempt from JWT verification in supabase/config.toml — without that the
# platform answers 401 before the function runs, which looks exactly like a
# working schedule that quietly does nothing.
#
# Required repository secrets:
#   SUPABASE_FUNCTIONS_URL   https://<project-ref>.supabase.co/functions/v1
#   AUCTION_REFRESH_SECRET
#   DEMAND_REFRESH_SECRET
#   NOTIFY_SWEEP_SECRET
#
# The edge functions use LOGS_RPC_URL when supplied and otherwise fall back to a
# public, wide-range Sepolia endpoint. Never point LOGS_RPC_URL at the operator
# RPC if its plan caps `eth_getLogs` to tiny ranges: a successful scan can still
# fall farther behind the chain on every run.

on:
  schedule:
    # Hourly, at :15 — clear of the top of the hour, when GitHub's queue is
    # busiest and scheduled jobs are most likely to be delayed.
    #
    # Daily used to be enough, when the only jobs were auction upkeep and demand
    # ingest. It is not enough to notify anyone: a marketplace offer expires 24
    # hours after it is made, so a daily pass can reach the owner minutes before
    # the offer lapses, or after. The auction and demand steps below skip
    # cheaply when there is nothing to do, so the extra passes cost little.
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  # Never overlap. Both functions drive the same operator key, and a second run
  # starting mid-flight would contend for its nonce.
  group: scheduled-sweeps
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Settle and re-open auctions
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.AUCTION_REFRESH_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::SUPABASE_FUNCTIONS_URL or AUCTION_REFRESH_SECRET is not set"
            exit 1
          fi
          # Capture the body and status separately so a non-2xx fails the job
          # loudly instead of being swallowed as a successful curl.
          BODY=$(curl -sS --fail-with-body --max-time 600 \
            -X POST "$URL/v1-auction-refresh" \
            -H "x-auction-refresh-secret: $SECRET") || {
              echo "::error::auction refresh failed: $BODY"
              exit 1
            }
          echo "$BODY"

      - name: Ingest bid demand
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.DEMAND_REFRESH_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::notice::DEMAND_REFRESH_SECRET is not set; skipping demand ingest"
            exit 0
          fi
          BODY=$(curl -sS --fail-with-body --max-time 600 \
            -X POST "$URL/v1-demand-refresh" \
            -H "x-demand-refresh-secret: $SECRET") || {
              echo "::error::demand refresh failed: $BODY"
              exit 1
            }
          echo "$BODY"
          # A 200 is not the same as a finished scan. The ingest commits its
          # cursor as it goes and stops on a time budget, so a run that is still
          # far behind returns success — and staying quiet about that is how a
          # scan that never converges passes for a healthy job.
          BEHIND=$(printf '%s' "$BODY" | python3 -c \
            'import json,sys; d=json.load(sys.stdin); print("" if d.get("caughtUp", True) else d.get("blocksBehind","?"))')
          if [ -n "$BEHIND" ]; then
            echo "::warning::demand ingest is still $BEHIND blocks behind the chain head."
            echo "If this figure is not falling run to run, the logs RPC span cap is too"
            echo "low to keep up — set LOGS_RPC_URL to a provider that allows wide"
            echo "eth_getLogs ranges."
          fi

      - name: Notify people about state waiting on them
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.NOTIFY_SWEEP_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::notice::NOTIFY_SWEEP_SECRET is not set; skipping notifications"
            exit 0
          fi
          # One invocation has a deliberate edge-runtime time budget. When a
          # deployment starts with history to scan, drain multiple resumable
          # passes in this same job instead of waiting for another best-effort
          # GitHub cron tick. Database uniqueness makes repeated event windows
          # idempotent.
          MAX_NOTIFY_PASSES=10
          for PASS in $(seq 1 "$MAX_NOTIFY_PASSES"); do
            BODY=$(curl -sS --fail-with-body --max-time 90 \
              -X POST "$URL/v1-notify-sweep" \
              -H "x-notify-sweep-secret: $SECRET") || {
                echo "::error::notification sweep failed on pass $PASS: $BODY"
                exit 1
              }
            echo "Notification pass $PASS/$MAX_NOTIFY_PASSES: $BODY"

            CAUGHT_UP=$(printf '%s' "$BODY" | python3 -c \
              'import json,sys; print("true" if json.load(sys.stdin).get("caughtUp") is True else "false")')
            if [ "$CAUGHT_UP" = "true" ]; then
              exit 0
            fi

            BEHIND=$(printf '%s' "$BODY" | python3 -c \
              'import json,sys; print(json.dumps(json.load(sys.stdin).get("blocksBehind",{})))')
            echo "::warning::notification pass $PASS has not caught up: $BEHIND"
          done

          echo "::error::notification sweep did not catch up after $MAX_NOTIFY_PASSES passes: $BEHIND"
          exit 1
