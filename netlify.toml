[build]
  command = "npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--prefer-offline"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sources Netlify Image CDN may fetch and resize for gem photos
# (resizedIpfsImageUrl in src/config/ipfs.ts). IPFS content is immutable, so
# each resized variant is fetched from the gateway once and then edge-cached.
[images]
  remote_images = ["https://gateway\\.pinata\\.cloud/ipfs/.*"]

[context.deploy-preview.environment]
  VITE_DATA_MODE = "mock"

[context.production]
  command = "npm run check"

# Production is selected by one immutable release file. A rollback must first
# reactivate the matching legacy database deployment and Edge contract secrets,
# then change this value to `sepolia-11155111-40fe3f22` and publish the legacy
# frontend bundle.
[context.production.environment]
  VITE_DEPLOYMENT_RELEASE = "sepolia-fresh-11828947"

# Content-hashed filenames: the name changes whenever the bytes do, so these can
# be cached indefinitely. Without this every asset costs a revalidation
# round-trip on each load, which is felt most on a phone over cellular.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached: it is what maps to the current hashed assets,
# and a stale copy points at chunks a later deploy has already removed.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/deployment-manifest.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
