project_id = "digital-carat"

# Only the keys set here differ from the CLI defaults. This file drives the
# local stack; it is not pushed to production by `db push` or `functions
# deploy`. Do not run `supabase config push` against production with this file:
# an [auth] table here would reset every auth setting it leaves out (site URL,
# redirect URLs, providers, SMTP) to the CLI defaults.
[auth]
# Anonymous sign-ins hand out an `authenticated` JWT to anyone with the anon
# key. Nothing in the app uses them. Production is switched off in the
# dashboard (Authentication -> Sign In / Providers -> Allow anonymous sign-ins).
enable_anonymous_sign_ins = false

[functions.v1-siwe-nonce]
verify_jwt = false

[functions.v1-siwe-verify]
verify_jwt = false

# Sumsub calls this server to server and cannot send a Supabase JWT, so the
# gateway rejected every delivery before the function ran. Authorization is the
# HMAC over the body (`x-payload-digest`, keyed by SUMSUB_WEBHOOK_SECRET), which
# the function checks itself and refuses with 401 when it does not match.
[functions.v1-sumsub-webhook]
verify_jwt = false

[functions.v1-seller-submit]
verify_jwt = false

[functions.v1-seller-commitment]
verify_jwt = false

[functions.v1-seller-activate]
verify_jwt = false

[functions.v1-redemption-commitment]
verify_jwt = false

[functions.v1-operations-capabilities]
verify_jwt = false

[functions.v1-appraisal-matrix]
verify_jwt = false

[functions.v1-gemlab-workflow]
verify_jwt = false

[functions.v1-bank-workflow]
verify_jwt = false

[functions.v1-admin-operations]
verify_jwt = false

[functions.v1-redemption-lifecycle]
verify_jwt = false

[functions.v1-private-file-url]
verify_jwt = false

[functions.v1-gift-create]
verify_jwt = false

[functions.v1-gift-cancel]
verify_jwt = false

[functions.v1-gift-notify]
verify_jwt = false

[functions.v1-canva-authorize]
verify_jwt = false

[functions.v1-canva-callback]
verify_jwt = false

[functions.v1-canva-export]
verify_jwt = false

# `inspect` has to answer before the recipient has an account — the claim page
# shows what the card is for, then asks for the email. The `claim` action calls
# `requireUser` itself.
[functions.v1-gift-claim]
verify_jwt = false

# Machine-called sweeps. They carry no user session, so the platform's JWT gate
# would reject a scheduler outright — a 401 from the gateway, before the function
# runs, which looks exactly like a working cron that quietly does nothing.
# Authorization is the secret each one checks itself, returning 403 without it.
[functions.v1-demand-refresh]
verify_jwt = false

[functions.v1-auction-refresh]
verify_jwt = false

[functions.v1-notify-sweep]
verify_jwt = false
