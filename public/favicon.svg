<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 -180 360 360" role="img" aria-label="Digital Carat">
  <title>Digital Carat</title>
  <!--
    The logo's emerald-cut gem alone: at 16px the stem and circle would shrink
    the gem to a few pixels, so the tab icon keeps only the outline, table and
    corner facets, with heavier strokes than the artwork. Deep emerald in light
    tabs, ivory in dark ones, where a dark green would vanish.
  -->
  <style>
    g { stroke: #0b3b2c; }
    @media (prefers-color-scheme: dark) {
      g { stroke: #e8dcb5; }
    }
  </style>
  <g fill="none" stroke-width="20" stroke-linejoin="miter">
    <polygon points="-63,-163 63,-163 106,-120 106,120 63,163 -63,163 -106,120 -106,-120" />
    <polygon points="-30,-100 30,-100 50,-80 50,80 30,100 -30,100 -50,80 -50,-80" />
    <path d="M-63 -163L-30 -100M63 -163L30 -100M106 -120L50 -80M106 120L50 80M63 163L30 100M-63 163L-30 100M-106 120L-50 80M-106 -120L-50 -80" />
  </g>
</svg>
