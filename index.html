<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F5F0" />
    <meta
      name="description"
      content="Digital Carat — the vault for tokenized gemstones. Verified custody, on-chain reserves, and physical redemption."
    />
    <title>Digital Carat · Tokenized Gemstones</title>
    <script>
      try {
        const savedScheme = localStorage.getItem('digital-carat-color-scheme');
        document.documentElement.dataset.colorScheme =
          savedScheme === 'garnet' ? 'garnet' : 'atelier';
        if (savedScheme === 'garnet') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A1524');
        }
      } catch {
        document.documentElement.dataset.colorScheme = 'atelier';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
