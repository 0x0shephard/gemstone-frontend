<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F5F0" />
    <!--
      SVG only, with a PNG for iOS home screens. No .ico: the build targets
      Safari 16, and every browser in that range reads an SVG favicon — which
      also lets the icon follow the user's colour scheme, as the app itself does.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Installability, which on iOS is the only route to Web Push. Safari grants
      the Push API solely to a site added to the Home Screen as a standalone web
      app, so without a manifest the notification control had nothing to offer
      and simply disappeared. `apple-mobile-web-app-capable` is the older iOS
      spelling of the same intent and is still what Safari reads.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Digital Carat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Digital Carat — the vault for tokenized gemstones. Verified custody, on-chain reserves, and physical redemption."
    />
    <title>Digital Carat · Tokenized Gemstones</title>
    <script>
      try {
        const savedScheme = localStorage.getItem('digital-carat-color-scheme');
        document.documentElement.dataset.colorScheme =
          savedScheme === 'garnet' ? 'garnet' : 'atelier';
        if (savedScheme === 'garnet') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A1524');
        }
      } catch {
        document.documentElement.dataset.colorScheme = 'atelier';
      }
    </script>
    <!--
      The first thing a visitor sees, drawn from this file alone. The app takes
      seconds to arrive on a first visit, and until then the page was blank.
      Inline and self-contained: nothing here may wait on a bundle.
    -->
    <style>
      html {
        background: #f8f5f0;
      }
      html[data-color-scheme='garnet'] {
        background: #0a1524;
      }
      #boot-shell {
        --bone: rgb(42 38 34 / 7%);
        box-sizing: border-box;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.25rem 1rem;
        overflow: hidden;
      }
      html[data-color-scheme='garnet'] #boot-shell {
        --bone: rgb(248 245 240 / 8%);
      }
      /* Gone as soon as React, or the boot guard below, puts anything in #root. */
      #root:not(:empty) + #boot-shell {
        display: none;
      }
      #boot-shell * {
        box-sizing: border-box;
        border-radius: 4px;
        background: var(--bone);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      /* Real text, not a box: browsers do not count shapes as content. */
      #boot-shell .mark {
        margin: 0.5rem 0 2.25rem;
        background: none;
        animation: none;
        color: #0b3b2c;
        font:
          500 1.25rem/1.5 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: 0.02em;
      }
      html[data-color-scheme='garnet'] #boot-shell .mark {
        color: #e8dcb5;
      }
      #boot-shell .title {
        height: 1.75rem;
        width: min(22rem, 70%);
        margin-bottom: 1.5rem;
      }
      #boot-shell .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
        gap: 1rem;
        background: none;
        animation: none;
      }
      #boot-shell .card {
        aspect-ratio: 4 / 5;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell * {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-shell" role="status" aria-label="Loading Digital Carat">
      <p class="mark">Digital Carat</p>
      <div class="title"></div>
      <div class="grid">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Boot guard. Deliberately ES5 and inline, because it has to run on the
       * browsers that fail to run the app bundle at all.
       *
       * The React error boundary only catches errors thrown once React is
       * rendering. A module that throws while evaluating — an API the browser
       * lacks, a failed chunk fetch — kills the bundle before any of that
       * mounts, leaving a blank page with nothing in the DOM. That happened on
       * older browsers via `URL.canParse` and was invisible to reporting.
       */
      (function () {
        var reported = false;
        function report(detail) {
          var root = document.getElementById('root');
          if (reported || !root || root.firstChild) return;
          reported = true;
          root.setAttribute('role', 'alert');
          root.style.cssText =
            'font:15px/1.6 system-ui,sans-serif;max-width:34rem;margin:14vh auto;padding:0 1.5rem;color:#2A2622';
          root.innerHTML =
            '<h1 style="font-size:19px;margin:0 0 .6rem">This browser cannot run Digital Carat</h1>' +
            '<p style="margin:0 0 .9rem;color:#6B635C">The application failed to start. This is usually an out-of-date browser — updating it, or opening the site in the latest Chrome, Safari, Firefox or Edge, should resolve it.</p>' +
            '<p style="font:12px/1.5 ui-monospace,monospace;color:#8A817A;word-break:break-word">' +
            String(detail).slice(0, 300) +
            '</p>';
        }
        window.addEventListener('error', function (event) {
          report((event && event.message) || 'Script error');
        });
        window.addEventListener('unhandledrejection', function (event) {
          report((event && event.reason && event.reason.message) || 'Unhandled rejection');
        });
        // Nothing mounted well after load: the entry module never ran.
        window.addEventListener('load', function () {
          setTimeout(function () {
            report('The application bundle did not start.');
          }, 8000);
        });
      })();
    </script>
  </body>
</html>
